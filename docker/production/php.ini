memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_vars = 5000
date.timezone = UTC

expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Code is baked into the image, so timestamps never change between deploys
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
